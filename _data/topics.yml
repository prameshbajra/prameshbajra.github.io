# Single source of truth for the post taxonomy.
#
# Drives three things: the tag pills on post/blog cards (_includes/post_tone.html),
# the hub pages under /topics/, and the `tags` on each post. Posts previously
# carried 147 unique tags across 31 posts (105 used exactly once), which is
# too thin to build hub pages from — every topic here is backed by 3+ posts.
#
# `label` must stay short; only AI/Cloud/Homelab/Networking/Self-host have
# dedicated colours in playful.css, the rest use the default pill.

- slug: homelab
